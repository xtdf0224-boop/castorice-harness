<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>栖枝浏览器</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14111f; --line: rgb(214 190 226 / 0.16); --line-strong: #ad90b7;
    --text: #f4f0f7; --text-3: #b7aac6; --accent: #d6c1e0; --accent-soft: rgb(214 193 224 / 0.14); --blue: #7cc8f7; --danger: #f28ba3;
    font-family: "Noto Sans SC", "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; user-select: none; }
  body { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  /* 冥河细线 */
  body::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 1px; background: linear-gradient(90deg, transparent, #865c98 14%, #c6aed3 62%, #7cc8f7 94%, transparent); opacity: 0.55; }
  button { display: grid; place-items: center; width: 30px; height: 30px; flex: none; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { background: var(--accent-soft); }
  button:disabled { opacity: 0.35; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  form { flex: 1; min-width: 0; display: flex; }
  .addr { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: rgb(10 9 19 / 0.6); }
  .addr:focus-within { border-color: var(--line-strong); box-shadow: 0 0 0 2px var(--accent-soft); }
  .addr svg { width: 13px; height: 13px; color: var(--text-3); flex: none; }
  .addr svg.secure { color: var(--accent); }
  input { flex: 1; min-width: 0; border: 0; background: none; color: var(--text); font: inherit; outline: none; user-select: text; }
  input::placeholder { color: var(--text-3); }
  .brand { display: flex; align-items: center; gap: 6px; flex: none; padding: 0 4px 0 2px; color: var(--accent); font-weight: 600; letter-spacing: 0.14em; }
  .brand svg { width: 22px; height: 22px; stroke: none; fill: none; }
  .agent { display: none; align-items: center; gap: 6px; flex: none; height: 26px; padding: 0 10px; border: 1px solid rgb(124 200 247 / 0.5); border-radius: 999px; color: var(--blue); font-size: 12px; white-space: nowrap; }
  .agent.on { display: inline-flex; }
  .agent i { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: pulse 2.4s ease-in-out infinite; }
  .msg { flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--danger); font-size: 12px; }
  .loading { position: fixed; left: 0; bottom: 0; height: 2px; width: 30%; background: linear-gradient(90deg, #865c98, #7cc8f7); box-shadow: 0 0 8px rgb(124 200 247 / 0.6); display: none; animation: slide 1.4s ease-in-out infinite; }
  .loading.on { display: block; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .agent i, .loading { animation: none; } }
</style>
</head>
<body>
  <span class="brand" title="栖枝浏览器：Agent 和你共用的浏览器窗口">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M2.5 34C9 32 15.5 34 22.5 31.2 27 29.4 30.5 26.6 36 21.8" stroke="#d6d0ee" stroke-width="1.7"/><g transform="translate(15.4 9.4) rotate(-14 12.4 16.7) scale(.62)" stroke="#1b1e52" stroke-width="2.4" stroke-linejoin="round" fill="#6f9aee"><path d="M20 15.2C17.2 7.2 9.6 2 4.6 4.2 2 5.5 2.6 10.8 7.2 15.4c3.5 3 8 2.4 12.8-.2zM20 16.6C14.9 16.8 9 19.2 8.8 24c-.1 4.4 4.2 5.8 7.2 3.2 2.6-2.3 3.5-6.6 4-10.6zM20 15.2c2.8-8 10.4-13.2 15.4-11 2.6 1.3 2 6.6-2.6 11.2-3.5 3-8 2.4-12.8-.2zM20 16.6c5.1.2 11 2.6 11.2 7.4.1 4.4-4.2 5.8-7.2 3.2-2.6-2.3-3.5-6.6-4-10.6z"/></g></svg>栖枝</span>
  <button id="back" type="button" title="后退" aria-label="后退" disabled><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="forward" type="button" title="前进" aria-label="前进" disabled><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button id="reload" type="button" title="刷新" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  <button id="home" type="button" title="起始页" aria-label="起始页"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
  <form id="go" autocomplete="off">
    <label class="addr">
      <svg id="lock" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="url" type="text" spellcheck="false" placeholder="输入网址，或搜索" aria-label="地址栏">
    </label>
  </form>
  <span id="msg" class="msg" role="status"></span>
  <span id="agent" class="agent" title="Agent 正在操作这个窗口；你随时可以自己接管"><i></i><span id="agentText">Agent 正在操作</span></span>
  <span id="loading" class="loading" aria-hidden="true"></span>
  <script src="bar.js"></script>
</body>
</html>
